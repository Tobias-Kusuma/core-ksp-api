services:

  api:
    image: core-ksp-api:1.0
    stop_grace_period: 35s

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5017:8080"

    # # kalau sudah multi instance dengan satu compose.yaml, bisa gunakan:
    # expose:
    #   - "8080"

    env_file:
      - .env

    environment:
      INSTANCE_NAME: api-1

    depends_on:
      - redis

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

