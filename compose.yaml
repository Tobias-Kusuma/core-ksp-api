  #   ports:
  #     - "9000:9000" # obj storage yang bisa diakses golang
  #     - "9001:9001" # console untuk akses manual

  #   environment:
  #     MINIO_ROOT_USER: admin
  #     MINIO_ROOT_PASSWORD: admin.123

  #   volumes:
  #     - "D:/DockerData/MinIO:/data"

  # mc:
