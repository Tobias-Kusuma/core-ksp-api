services:

  api:
    image: core-ksp-api:1.0
    stop_grace_period: 35s

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5017:8080"

    # # kalau sudah multi instance dengan satu compose.yaml, bisa gunakan:
    # expose:
    #   - "8080"

    env_file:
      - .env

    environment:
      INSTANCE_NAME: api-1
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # minio:
  #   image: minio/minio
